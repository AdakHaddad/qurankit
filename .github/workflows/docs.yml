name: Build Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv pip install --system mkdocs-material mkdocstrings-python mkdocs-jupyter mkdocs-section-index mkdocs-autorefs pymdown-extensions
      - name: Build documentation
        run: uv run mkdocs build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
