name: Diagnose

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python
        run: python --version && pip --version
      - name: Check repo
        run: ls -la
      - name: Check pyproject
        run: cat pyproject.toml
